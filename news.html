<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMING.LUXUS - News</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            background: #1f2937;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 12px 16px;
            border-radius: 9px;
            transition: 0.2s;
        }

        nav a:hover {
            background: #374151;
        }

        nav a.active {
            background: #374151;
        }

        /* =========================
           HAUPTBEREICH
        ========================= */

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .header p {
            color: #d1d5db;
        }

        /* =========================
           NEWS
        ========================= */

        .news-card {
            background: #1f2937;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .news-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .news-date {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .news-text {
            color: #d1d5db;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* =========================
           KEINE NEWS
        ========================= */

        .no-news {
            background: #1f2937;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: #d1d5db;
        }

        /* =========================
           BUTTON
        ========================= */

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #374151;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-button:hover {
            background: #4b5563;
        }

        /* =========================
           HANDY
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 10px;
            }

            nav a {
                font-size: 15px;
                padding: 10px 12px;
            }

            .container {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

    <a href="index.html">
        🏠 Startseite
    </a>

    <a href="news.html" class="active">
        📰 News
    </a>

    <a href="wartung.html">
        ⚠️ Wartungszeiten
    </a>

    <a href="regeln.html">
        ❗ Regeln
    </a>

    <a href="status.html">
        ℹ️ Server Status
    </a>

</nav>


<!-- =========================
     HAUPTBEREICH
========================= -->

<main class="container">


    <div class="header">

        <h1>
            📰 GAMING.LUXUS News
        </h1>

        <p>
            Hier findest du die neuesten Nachrichten
            rund um GAMING.LUXUS.
        </p>

    </div>


    <!-- =========================
         NEWS-BEREICH
    ========================= -->

    <div id="newsContainer"></div>


    <a
        href="index.html"
        class="back-button"
    >
        ⬅️ Zurück zur Startseite
    </a>


</main>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    function loadNews() {

        const newsContainer =
            document.getElementById("newsContainer");


        /*
         * Gespeicherte News holen
         */

        const gespeicherteNews =
            localStorage.getItem("gamingLuxusNews");


        /*
         * Keine News vorhanden
         */

        if (!gespeicherteNews) {

            newsContainer.innerHTML = `
            
                <div class="no-news">

                    📰 Noch keine News vorhanden.

                    <br><br>

                    Sobald eine News veröffentlicht
                    wurde, wird sie hier angezeigt.

                </div>

            `;

            return;

        }


        /*
         * News umwandeln
         */

        const news =
            JSON.parse(gespeicherteNews);


        /*
         * News anzeigen
         */

        newsContainer.innerHTML = `

            <div class="news-card">

                <h2>
                    📰 ${escapeHTML(news.title)}
                </h2>

                <div class="news-date">
                    📅 ${escapeHTML(news.date)}
                </div>

                <div class="news-text">
                    ${escapeHTML(news.text)}
                </div>

            </div>

        `;

    }


    /*
     * Schutz vor HTML-Code
     */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /*
     * News laden
     */

    loadNews();

</script>


</body>

</html>
