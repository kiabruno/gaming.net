<button onclick="openPasswordBox()" class="team-button">
    🔒 Team-Bereich
</button>

<div id="passwordBox" class="password-box" style="display: none;">
    <div class="password-content">
        <h2>🔒 Geschützter Bereich</h2>
        <p>Bitte gib das Passwort ein:</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Passwort"
            onkeydown="if(event.key === 'Enter') checkPassword()"
        >

        <button onclick="checkPassword()">Anmelden</button>
        <button onclick="closePasswordBox()">Abbrechen</button>

        <p id="passwordError"></p>
    </div>
</div>
